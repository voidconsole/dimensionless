<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VOID</title>
    <script>
      // SPA fallback: route all unknown paths back to the app root.
      sessionStorage.setItem("void:404", window.location.pathname);
      window.location.replace("/");
    </script>
  </head>
  <body></body>
</html>
